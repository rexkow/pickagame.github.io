<body class="bg-gray-50 text-gray-800">

  </div>
    <div class="space-x-6 hidden md:flex">

      <a href="#contact" class="hover:text-blue-600" data-i18n="nav_contact"></a>
      <button onclick="setLang('en')" class="text-sm">EN</button>
      <button onclick="setLang('pl')" class="text-sm">PL</button>
    </div>
  </div>
</nav>

<div class="pt-24">

  <svg width="24" height="24" viewBox="0 0 512 512">

    <path fill="#4285F4" d="M348.2 257.2l56.6-56.6c6.5-6.5 6.5-17 0-23.5L360 132l-79 79 67.2 46.2z"/>
    <path fill="#FBBC05" d="M303.3 303.3l-248 248 25.3 25.3c6.5 6.5 17 6.5 23.5 0l221.2-221.2-22-22z"/>
    <path fill="#EA4335" d="M281 211l-79-79 67.3-67.3c6.5-6.5 17-6.5 23.5 0l45.8 45.8c6.5 6.5 6.5 17 0 23.5L281 211z"/>
  </svg>

  <div class="text-left">

  </div>

</a>

</section>

             class="w-[320px] rounded-3xl shadow-2xl border">

    </div>

    <!-- Feature 2 -->
    <div class="flex flex-col md:flex-row items-center gap-16">
      <div class="flex-1 max-w-lg">
        <h3 class="text-3xl md:text-4xl font-bold mb-6"
            data-i18n="feature2_title"></h3>
        <p class="text-lg text-gray-600 leading-relaxed"
           data-i18n="feature2_desc"></p>
      </div>
      <div class="flex-1 flex justify-center">
        <img src="assets/feature2.png"
             class="w-[320px] rounded-3xl shadow-2xl border">
      </div>
    </div>

    <!-- Feature 3 -->
    <div class="flex flex-col md:flex-row-reverse items-center gap-16">
      <div class="flex-1 max-w-lg">
        <h3 class="text-3xl md:text-4xl font-bold mb-6"
            data-i18n="feature3_title"></h3>
        <p class="text-lg text-gray-600 leading-relaxed"
           data-i18n="feature3_desc"></p>
      </div>
      <div class="flex-1 flex justify-center">
        <img src="assets/feature3.png"

    </div>

<!-- ABOUT -->

    <p class="text-gray-600" data-i18n="about_desc"></p>
  </div>
</section>

<!-- CONTACT -->
<section id="contact" class="bg-white py-16">

    <p class="text-gray-600 mb-4" data-i18n="contact_desc"></p>
    <a href="mailto:pickagame.app@gmail.com" class="text-blue-600 font-medium">
      pickagame.app@gmail.com
    </a>
  </div>
</section>

<!-- FOOTER -->
<footer class="py-10 bg-gray-50 border-t">
  <div class="max-w-6xl mx-auto px-6 text-center space-y-4">

    <p class="text-sm text-gray-500">
      © 2026 PickaGame
    </p>

    <div class="flex justify-center items-center gap-3">
      <a href="https://boardgamegeek.com"
         target="_blank"
         rel="noopener"
         class="hover:opacity-80 transition">
        <img src="assets/bgg.png"
             alt="BoardGameGeek"
             class="h-8 object-contain">
      </a>
    </div>

  </div>
</footer>

</div>

<script>
const translations = {
  en: {
    nav_features: "Features",
    nav_about: "About",
    nav_contact: "Contact",

    hero_title: "Choose your next board game in seconds",
    hero_sub: "Smart group-based selection with controlled randomness and play history tracking.",

    features_title: "Why Pick a Game?",
    feature1_title: "Preference-based selection",
    feature1_desc: "Matches games to player preferences for optimal group satisfaction.",
    feature2_title: "Smart randomness",
    feature2_desc: "Adds controlled randomness to avoid repetitive choices.",
    feature3_title: "Play history tracking",
    feature3_desc: "Prevents overplaying the same games and keeps sessions fresh.",

    about_title: "About the App",
    about_desc: "Pick a Game was created to solve the classic board game meetup problem: deciding what to play often takes longer than the game itself.",

    contact_title: "Feedback & Bug Reports",
    contact_desc: "Found a bug or have a suggestion? Get in touch."
  },

  pl: {
    nav_features: "Funkcje",
    nav_about: "O aplikacji",
    nav_contact: "Kontakt",

    hero_title: "Wybierz następną grę planszową w kilka sekund",
    hero_sub: "Inteligentny wybór gry dla grupy z kontrolowaną losowością i historią rozgrywek.",

    features_title: "Dlaczego Pick a Game?",
    feature1_title: "Wybór oparty na preferencjach",
    feature1_desc: "Dopasowuje gry do preferencji graczy.",
    feature2_title: "Kontrolowana losowość",
    feature2_desc: "Zapobiega ciągłemu graniu w te same tytuły.",
    feature3_title: "Historia rozgrywek",
    feature3_desc: "Pomaga utrzymać świeżość spotkań planszówkowych.",

    about_title: "O aplikacji",
    about_desc: "Pick a Game powstał, aby rozwiązać problem spotkań planszówkowych: decyzja 'w co gramy?' często trwa dłużej niż sama rozgrywka.",

    contact_title: "Zgłaszanie błędów i sugestii",
    contact_desc: "Znalazłeś błąd lub masz pomysł? Napisz do nas."
  }
};

function setLang(lang) {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    el.innerText = translations[lang][key];
  });
}

const userLang = navigator.language.startsWith("pl") ? "pl" : "en";
setLang(userLang);
</script>

</body>
</html>
