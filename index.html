<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pick a Game</title>
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="apple-touch-icon" href="assets/icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-800">

<!-- NAVBAR -->
<nav class="fixed w-full bg-white shadow-sm z-50">
  <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
  <div class="flex items-center gap-3">
  <img src="assets/icon.png"
     class="h-8 w-8 object-cover rounded-[22%] shadow-sm">
  <span class="text-xl font-semibold">Pick a Game</span>
  </div>
    <div class="space-x-6 hidden md:flex">
      <a href="#features" class="hover:text-blue-600" data-i18n="nav_features"></a>
      <a href="#about" class="hover:text-blue-600" data-i18n="nav_about"></a>
      <a href="#contact" class="hover:text-blue-600" data-i18n="nav_contact"></a>
      <button onclick="setLang('en')" class="text-sm">EN</button>
      <button onclick="setLang('pl')" class="text-sm">PL</button>
    </div>
  </div>
</nav>

<div class="pt-24">

<!-- HERO -->
<section class="max-w-6xl mx-auto px-6 py-20 flex flex-col md:flex-row items-center gap-16">

  <div class="flex-1 max-w-xl">
    <h1 class="text-4xl md:text-6xl font-bold mb-6 leading-tight"
        data-i18n="hero_title"></h1>

    <p class="text-lg text-gray-600 mb-10"
       data-i18n="hero_sub"></p>

    <!-- Official Google Play Badge -->
    <a href="https://play.google.com/store/apps/details?id=com.pickagame.app"
       target="_blank"
       rel="noopener"
       class="inline-block hover:opacity-90 transition">
      <img src="assets/google-play-badge.png"
           alt="Get it on Google Play"
           class="h-14">
    </a>

  </div>

  <div class="flex-1 flex justify-center">
    <div class="relative">
      <img src="assets/hero.png"
           class="w-[320px] rounded-3xl shadow-2xl border">
    </div>
  </div>

</section>

<!-- FEATURES -->
<section id="features" class="py-24 bg-white">
  <div class="max-w-6xl mx-auto px-6 space-y-32">

    <!-- Feature 1 -->
    <div class="flex flex-col md:flex-row-reverse items-center gap-16">
      <div class="flex-1 max-w-lg">
        <h3 class="text-3xl md:text-4xl font-bold mb-6"
            data-i18n="feature1_title"></h3>
        <p class="text-lg text-gray-600 leading-relaxed"
           data-i18n="feature1_desc"></p>
      </div>
      <div class="flex-1 flex justify-center">
        <img src="assets/feature1.png"
             class="w-[320px] rounded-3xl shadow-2xl border">
      </div>
    </div>

    <!-- Feature 2 -->
    <div class="flex flex-col md:flex-row items-center gap-16">
      <div class="flex-1 max-w-lg">
        <h3 class="text-3xl md:text-4xl font-bold mb-6"
            data-i18n="feature2_title"></h3>
        <p class="text-lg text-gray-600 leading-relaxed"
           data-i18n="feature2_desc"></p>
      </div>
      <div class="flex-1 flex justify-center">
        <img src="assets/feature2.png"
             class="w-[320px] rounded-3xl shadow-2xl border">
      </div>
    </div>

    <!-- Feature 3 -->
    <div class="flex flex-col md:flex-row-reverse items-center gap-16">
      <div class="flex-1 max-w-lg">
        <h3 class="text-3xl md:text-4xl font-bold mb-6"
            data-i18n="feature3_title"></h3>
        <p class="text-lg text-gray-600 leading-relaxed"
           data-i18n="feature3_desc"></p>
      </div>
      <div class="flex-1 flex justify-center">
        <img src="assets/feature3.png"
             class="w-[320px] rounded-3xl shadow-2xl border">
      </div>
    </div>

  </div>
</section>

<!-- ABOUT -->
<section id="about" class="py-16">
  <div class="max-w-3xl mx-auto px-6 text-center">
    <h2 class="text-3xl font-bold mb-6" data-i18n="about_title"></h2>
    <p class="text-gray-600" data-i18n="about_desc"></p>
  </div>
</section>

<!-- CONTACT -->
<section id="contact" class="bg-white py-16">
  <div class="max-w-3xl mx-auto px-6 text-center">
    <h2 class="text-3xl font-bold mb-6" data-i18n="contact_title"></h2>
    <p class="text-gray-600 mb-4" data-i18n="contact_desc"></p>
    <a href="mailto:pickagame.app@gmail.com" class="text-blue-600 font-medium">
      pickagame.app@gmail.com
    </a>
  </div>
</section>

<!-- FOOTER -->
<footer class="py-6 bg-gray-50 border-t">
  <div class="max-w-6xl mx-auto px-6">

    <div class="flex flex-col md:flex-row items-center justify-between gap-4">

      <!-- Powered by BGG -->
      <div class="flex items-center gap-3">
        <span class="text-sm text-gray-500">Powered by</span>
        <a href="https://boardgamegeek.com"
           target="_blank"
           rel="noopener"
           class="hover:opacity-80 transition">
          <img src="assets/bgg.png"
               alt="BoardGameGeek"
               class="h-6 object-contain">
        </a>
      </div>

      <!-- Copyright -->
      <div class="text-sm text-gray-500">
        © 2026 PickaGame
      </div>

    </div>

  </div>
</footer>

</div>

<script>
const translations = {
  en: {
    nav_features: "Features",
    nav_about: "About",
    nav_contact: "Contact",

    hero_title: "Fair and efficient game selection for recurring game nights",
    hero_sub: "A history-aware weighted draw system that reduces decision time and balances outcomes within your selected pool.",

    feature1_title: "Reduce decision friction",
    feature1_desc: "When multiple players have different preferences, reaching consensus can take time. PickaGame structures the process and moves the group toward a decision faster.",
    feature2_title: "Go beyond the safest common choice",
    feature2_desc: "Groups often default to games that are equally acceptable to everyone. Over time, this can limit overall satisfaction.",
    feature3_title: "History-aware weighted draws",
    feature3_desc: "Probability adjusts based on previous outcomes within the selected preference set. Games that repeatedly missed selection gradually gain weight, improving fairness over time.",

    about_title: "About PickaGame",
    about_desc: "PickaGame is not a pure randomizer. It tracks previous draw outcomes and adapts probability within the currently selected game pool. The goal is long-term fairness and higher aggregate satisfaction, not just equal compromise.",

    contact_title: "Feedback & Bug Reports",
    contact_desc: "Found a bug or have a suggestion? Get in touch."
  },

  pl: {
    nav_features: "Funkcje",
    nav_about: "O aplikacji",
    nav_contact: "Kontakt",

    hero_title: "Sprawiedliwy i efektywny wybór gier na regularne spotkania",
    hero_sub: "System losowania oparty na historii, który skraca czas decyzji i równoważy wyniki w ramach wybranej puli.",

    feature1_title: "Mniej czasu na decyzję",
    feature1_desc: "Gdy preferencje graczy się różnią, dojście do wspólnego wyboru potrafi się wydłużać. PickaGame porządkuje proces i przyspiesza decyzję.",
    feature2_title: "Więcej niż najbezpieczniejszy kompromis",
    feature2_desc: "Grupy często wybierają gry, które są po prostu akceptowalne dla wszystkich. W dłuższym okresie nie zawsze maksymalizuje to satysfakcję całej grupy.",
    feature3_title: "Losowanie ważone historią",
    feature3_desc: "Prawdopodobieństwo dostosowuje się na podstawie wcześniejszych wyników w obrębie wybranej puli. Gry, które wielokrotnie nie zostały wylosowane, stopniowo zyskują większą wagę.",

    about_title: "O PickaGame",
    about_desc: "PickaGame to coś więcej niż zwykłe losowanie. Aplikacja analizuje wcześniejsze wyniki i dynamicznie dostosowuje prawdopodobieństwa w ramach aktualnie wybranych gier. Celem jest długoterminowa sprawiedliwość i wyższa łączna satysfakcja grupy, a nie jedynie kompromis.",
    contact_title: "Zgłaszanie błędów i sugestii",
    contact_desc: "Znalazłeś błąd lub masz pomysł? Napisz do nas."
  }
};

function setLang(lang) {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    el.innerText = translations[lang][key];
  });
}

const userLang = navigator.language.startsWith("pl") ? "pl" : "en";
setLang(userLang);
</script>

</body>
</html>
