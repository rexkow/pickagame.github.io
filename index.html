    <div class="space-x-6 hidden md:flex">

<script>
const translations = {
  en: {
    nav_features: "How it works",
    nav_about: "About",
    nav_contact: "Contact",

    hero_title: "A smarter way to choose board games",
    hero_sub: "Pick a Game helps board game groups spend less time deciding and more time playing — using weighted draws based on past results.",

    feature1_title: "Less time deciding",
    feature1_desc: "Choosing a board game can easily take longer than setting it up. Pick a Game narrows the options based on player preferences and moves the group toward a decision faster.",

    feature2_title: "More than the safest compromise",
    feature2_desc: "Board game groups often default to titles that are \"fine for everyone\". Over time, that doesn’t always mean the highest overall enjoyment.",

    feature3_title: "Weighted board game draws",
    feature3_desc: "Within the selected preference pool, probability adjusts based on previous results. Board games that repeatedly missed selection slowly gain weight, helping balance outcomes over time — without removing randomness.",

    about_title: "About Pick a Game",
    about_desc: "Pick a Game is a hobby project built for board game groups that meet regularly. It’s not a pure randomizer. The app tracks past draw results and adjusts probabilities within the currently selected board games. The goal is simple: reduce friction, avoid repetitive compromises, and keep decisions feeling fair over time.",

    contact_title: "Feedback & Bug Reports",
    contact_desc: "Have feedback, found a bug, or want to suggest an improvement? Send a message."
  },

  pl: {
    nav_features: "Jak to działa",
    nav_about: "O aplikacji",
    nav_contact: "Kontakt",

    hero_title: "Sprytniejszy sposób na wybór gier planszowych",
    hero_sub: "Pick a Game pomaga grupom planszówkowym spędzać mniej czasu na decyzjach, a więcej na graniu — wykorzystując losowanie ważone historią.",

    feature1_title: "Mniej czasu na wybór",
    feature1_desc: "Wybór gry planszowej potrafi trwać dłużej niż jej rozłożenie. Pick a Game zawęża pulę na podstawie preferencji graczy i przyspiesza podjęcie decyzji.",

    feature2_title: "Więcej niż najbezpieczniejszy kompromis",
    feature2_desc: "Grupy planszówkowe często wracają do tytułów, które są \"w porządku dla wszystkich\". W dłuższym okresie nie zawsze oznacza to najwyższą satysfakcję.",

    feature3_title: "Losowanie ważone gier planszowych",
    feature3_desc: "W obrębie wybranej puli preferencji prawdopodobieństwo dostosowuje się na podstawie wcześniejszych wyników. Gry planszowe, które wielokrotnie nie zostały wylosowane, stopniowo zyskują większą wagę — zachowując element losowości.",

    about_title: "O Pick a Game",
    about_desc: "Pick a Game to hobbystyczny projekt stworzony dla grup, które regularnie grają w gry planszowe. To nie jest zwykły randomizer. Aplikacja analizuje historię losowań i dostosowuje prawdopodobieństwa w ramach aktualnie wybranych gier planszowych. Celem jest mniej tarcia przy decyzji, mniej powtarzalnych kompromisów i większe poczucie sprawiedliwości w dłuższym okresie.",

    contact_title: "Zgłaszanie błędów i sugestii",
    contact_desc: "Masz sugestię, znalazłeś błąd lub chcesz coś ulepszyć? Napisz wiadomość."
  }
};

function setLang(lang) {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    el.innerText = translations[lang][key];
  });
}

const userLang = navigator.language.startsWith("pl") ? "pl" : "en";
setLang(userLang);
</script>

</body>
