<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pick a Game – Board Game Selection App</title>
  <meta name="description" content="Pick a Game is a board game selection app that uses weighted draws based on past results to help groups choose what to play.">
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="apple-touch-icon" href="assets/icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-800">

<!-- NAVBAR -->
<nav class="fixed w-full bg-white shadow-sm z-50">
  <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
  <div class="flex items-center gap-3">
  <img src="assets/icon.png"
     class="h-8 w-8 object-cover rounded-[22%] shadow-sm">
  <span class="text-xl font-semibold">Pick a Game</span>
  </div>
    <div class="space-x-6 hidden md:flex">
      <a href="#features" class="hover:text-blue-600" data-i18n="nav_features"></a>
      <a href="#about" class="hover:text-blue-600" data-i18n="nav_about"></a>
      <a href="#contact" class="hover:text-blue-600" data-i18n="nav_contact"></a>
      <button onclick="setLang('en')" class="text-sm">EN</button>
      <button onclick="setLang('pl')" class="text-sm">PL</button>
    </div>
  </div>
</nav>

<div class="pt-24">

<!-- HERO -->
<section class="max-w-6xl mx-auto px-6 py-20 flex flex-col md:flex-row items-center gap-16">

  <div class="flex-1 max-w-xl">
    <h1 class="text-4xl md:text-6xl font-bold mb-6 leading-tight"
        data-i18n="hero_title"></h1>

    <p class="text-lg text-gray-600 mb-10"
       data-i18n="hero_sub"></p>

    <!-- Official Google Play Badge -->
    <a href="https://play.google.com/store/apps/details?id=com.pickagame.app"
       target="_blank"
       rel="noopener"
       class="inline-block hover:opacity-90 transition">
      <img src="assets/google-play-badge.png"
           alt="Get it on Google Play"
           class="h-14">
    </a>

  </div>

  <div class="flex-1 flex justify-center">
    <div class="relative">
      <img src="assets/hero.png"
           class="w-[320px] rounded-3xl shadow-2xl border">
    </div>
  </div>

</section>

<!-- FEATURES -->
<section id="features" class="py-24 bg-white">
  <div class="max-w-6xl mx-auto px-6 space-y-32">

    <!-- Feature 1 -->
    <div class="flex flex-col md:flex-row-reverse items-center gap-16">
      <div class="flex-1 max-w-lg">
        <h3 class="text-3xl md:text-4xl font-bold mb-6"
            data-i18n="feature1_title"></h3>
        <p class="text-lg text-gray-600 leading-relaxed"
           data-i18n="feature1_desc"></p>
      </div>
      <div class="flex-1 flex justify-center">
        <img src="assets/feature1.png"
             class="w-[320px] rounded-3xl shadow-2xl border">
      </div>
    </div>

    <!-- Feature 2 -->
    <div class="flex flex-col md:flex-row items-center gap-16">
      <div class="flex-1 max-w-lg">
        <h3 class="text-3xl md:text-4xl font-bold mb-6"
            data-i18n="feature2_title"></h3>
        <p class="text-lg text-gray-600 leading-relaxed"
           data-i18n="feature2_desc"></p>
      </div>
      <div class="flex-1 flex justify-center">
        <img src="assets/feature2.png"
             class="w-[320px] rounded-3xl shadow-2xl border">
      </div>
    </div>

    <!-- Feature 3 -->
    <div class="flex flex-col md:flex-row-reverse items-center gap-16">
      <div class="flex-1 max-w-lg">
        <h3 class="text-3xl md:text-4xl font-bold mb-6"
            data-i18n="feature3_title"></h3>
        <p class="text-lg text-gray-600 leading-relaxed"
           data-i18n="feature3_desc"></p>
      </div>
      <div class="flex-1 flex justify-center">
        <img src="assets/feature3.png"
             class="w-[320px] rounded-3xl shadow-2xl border">
      </div>
    </div>

  </div>
</section>

<!-- ABOUT -->
<section id="about" class="py-24 bg-gray-50">
  <div class="max-w-4xl mx-auto px-6">

    <div class="bg-white rounded-2xl shadow-sm border p-8 md:p-12 space-y-8">

      <h2 class="text-3xl md:text-4xl font-bold text-center"
          data-i18n="about_title"></h2>

      <div class="space-y-6 text-gray-700 leading-relaxed text-sm md:text-base">

        <p data-i18n="about_intro"></p>

        <h3 class="text-xl font-semibold mt-6"
            data-i18n="about_algo_title"></h3>
        <p data-i18n="about_algo_desc"></p>

        <h3 class="text-xl font-semibold mt-6"
            data-i18n="about_bgg_title"></h3>
        <p data-i18n="about_bgg_desc"></p>

        <h3 class="text-xl font-semibold mt-6"
            data-i18n="about_advanced_title"></h3>
        <p data-i18n="about_advanced_desc"></p>

      </div>

    </div>

  </div>
</section>

<!-- CONTACT -->
<section id="contact" class="bg-white py-16">
  <div class="max-w-3xl mx-auto px-6 text-center">
    <h2 class="text-3xl font-bold mb-6" data-i18n="contact_title"></h2>
    <p class="text-gray-600 mb-4" data-i18n="contact_desc"></p>
    <a href="mailto:pickagame.app@gmail.com" class="text-blue-600 font-medium">
      pickagame.app@gmail.com
    </a>
  </div>
</section>

<!-- FOOTER -->
<footer class="py-6 bg-gray-50 border-t">
  <div class="max-w-6xl mx-auto px-6">

    <div class="flex flex-col md:flex-row items-center justify-between gap-4">

      <!-- Powered by BGG -->
      <div class="flex items-center gap-3">
        <a href="https://boardgamegeek.com"
           target="_blank"
           rel="noopener"
           class="hover:opacity-80 transition">
          <img src="assets/bgg.png"
               alt="BoardGameGeek"
               class="h-6 object-contain">
        </a>
      </div>

      <!-- Copyright -->
      <div class="text-sm text-gray-500">
        © 2026 Pick a Game
      </div>

    </div>

  </div>
</footer>

</div>

<script>
const translations = {
  en: {
    nav_features: "How it works",
    nav_about: "Under the hood",
    nav_contact: "Contact",

    hero_title: "A smarter way to choose board games",
    hero_sub: "Pick a Game helps board game groups spend less time deciding and more time playing — using weighted draws based on past results.",

    feature1_title: "Less time deciding",
    feature1_desc: "Choosing a board game can easily take longer than setting it up. Pick a Game narrows the options based on player preferences and moves the group toward a decision faster.",

    feature2_title: "More than the safest compromise",
    feature2_desc: "Board game groups often default to titles that are \"fine for everyone\". Over time, that doesn’t always mean the highest overall enjoyment.",

    feature3_title: "Weighted board game draws",
    feature3_desc: "Within the selected preference pool, probability adjusts based on previous results. Board games that repeatedly missed selection slowly gain weight — without removing randomness.",

    about_title: "Under the hood",

    about_intro: "Pick a Game is a hobby project built for board game groups that meet regularly. It’s not a pure randomizer — the draw system adapts over time.",

    about_algo_title: "How the weighted draw works",
    about_algo_desc: "Each draw distributes a total of 10 points across player preferences (5 / players for first choice, 3 / players for second, 2 / players for third). Historical points from previous draws are added for the currently selected board games. A weighted random draw is performed, 10 points are subtracted from the selected game, and updated values are saved for future draws.",

    about_bgg_title: "BoardGameGeek integration",
    about_bgg_desc: "Every board game is identified by its BoardGameGeek ID to avoid confusion between editions and languages. The search first checks a local database of several thousand popular board games (English titles). If needed, it queries BoardGameGeek directly. Results are sorted by BGG rank. Only board games listed on BGG can currently be used.",

    about_advanced_title: "Advanced options",
    about_advanced_desc: "Players can use Veto (block one title for the current draw) or Prefer Not (reduce a title’s weight without removing it entirely). These tools allow stronger preferences to be expressed without breaking the system.",

    about_data_title: "Meeting history & export",
    about_data_desc: "Draw history is essential to the system. Pick a Game allows exporting and importing data so accumulated history can be preserved across devices.",

    contact_title: "Feedback & Bug Reports",
    contact_desc: "Have feedback or found a bug? Send a message."
  },

  pl: {
    nav_features: "Jak to działa",
    nav_about: "Pod maską",
    nav_contact: "Kontakt",

    hero_title: "Sprytniejszy sposób na wybór gier planszowych",
    hero_sub: "Pick a Game pomaga grupom planszówkowym spędzać mniej czasu na decyzjach, a więcej na graniu — wykorzystując losowanie ważone historią.",

    feature1_title: "Mniej czasu na wybór",
    feature1_desc: "Wybór gry planszowej potrafi trwać dłużej niż jej rozłożenie. Pick a Game zawęża pulę na podstawie preferencji graczy i przyspiesza decyzję.",

    feature2_title: "Więcej niż najbezpieczniejszy kompromis",
    feature2_desc: "Grupy planszówkowe często wracają do tytułów, które są „w porządku dla wszystkich”. W dłuższym okresie nie zawsze oznacza to najwyższą satysfakcję.",

    feature3_title: "Losowanie ważone gier planszowych",
    feature3_desc: "W obrębie wybranej puli prawdopodobieństwo dostosowuje się na podstawie wcześniejszych wyników. Gry planszowe, które nie zostały wylosowane, stopniowo zyskują większą wagę.",

    about_title: "Pod maską",

    about_intro: "Pick a Game to hobbystyczny projekt dla grup regularnie grających w gry planszowe. To nie jest zwykły randomizer — system losowania dostosowuje się w czasie.",

    about_algo_title: "Jak działa losowanie ważone",
    about_algo_desc: "W każdym losowaniu rozdzielanych jest łącznie 10 punktów (5 / liczba graczy za pierwszy wybór, 3 / liczba graczy za drugi, 2 / liczba graczy za trzeci). Do punktów dodawane są wartości z wcześniejszych losowań dla aktualnie wybranych gier planszowych. Następnie wykonywane jest losowanie ważone, 10 punktów odejmowane jest zwycięskiej grze, a nowe wartości są zapisywane.",

    about_bgg_title: "Integracja z BoardGameGeek",
    about_bgg_desc: "Każda gra planszowa identyfikowana jest poprzez BGG ID, co eliminuje problem różnych edycji i wersji językowych. Wyszukiwanie najpierw korzysta z lokalnej bazy kilku tysięcy popularnych gier planszowych (tytuły w języku angielskim). Jeśli to nie wystarczy, aplikacja przeszukuje bezpośrednio bazę BoardGameGeek. Wyniki sortowane są według rankingu BGG. Obecnie można używać tylko gier posiadających wpis w BGG.",

    about_advanced_title: "Opcje zaawansowane",
    about_advanced_desc: "Dostępne są opcje Weto (blokuje jedną grę w bieżącym losowaniu) oraz Wolę nie (zmniejsza wagę wybranego tytułu). Pozwala to wyrazić silniejsze preferencje bez rozbijania systemu.",

    about_data_title: "Historia spotkań i eksport danych",
    about_data_desc: "Historia losowań jest kluczowa dla działania algorytmu. Aplikacja umożliwia eksport i import danych, dzięki czemu można przenieść zgromadzoną historię na nowe urządzenie.",

    contact_title: "Zgłaszanie błędów i sugestii",
    contact_desc: "Masz sugestię lub znalazłeś błąd? Napisz wiadomość."
  }
};

function setLang(lang) {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    el.innerText = translations[lang][key];
  });
}

const userLang = navigator.language.startsWith("pl") ? "pl" : "en";
setLang(userLang);
</script>

</body>
</html>
